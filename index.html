<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competenz | Gestão Educacional</title>
    <link rel="icon" type="image/png" href="assets/images/logo-icon.png">

    <!-- Scripts & Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/pt-br.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/utc.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/timezone.js"></script>
    <script src="https://unpkg.com/imask"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        dayjs.extend(window.dayjs_plugin_utc);
        dayjs.extend(window.dayjs_plugin_timezone);
        dayjs.locale('pt-br');
        dayjs.tz.setDefault("America/Fortaleza");
        window.dayjs = dayjs;
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                        display: ['"Outfit"', 'sans-serif'],
                    },
                    colors: {
                        colors: {
                            navy: {
                                DEFAULT: '#1a1a2e', // Dark Navy
                                light: '#2a2a40',
                            },
                            lime: {
                                DEFAULT: '#b3ff50', // Lime Green
                                hover: '#a0e640',
                            },
                            purple: {
                                DEFAULT: '#8e44ad', // Deep Purple
                            },
                            blue: {
                                DEFAULT: '#3498db', // Light Blue
                            },
                            mint: {
                                DEFAULT: '#2ecc71', // Mint Green
                            },
                            gray: {
                                50: '#f9fafb',
                                100: '#f4f4f5', // Light Gray
                                200: '#e4e4e7',
                                300: '#d4d4d8',
                                400: '#a1a1aa',
                                500: '#71717a',
                                600: '#52525b',
                                700: '#3f3f46',
                                800: '#27272a',
                                900: '#18181b', // Dark Gray
                            },
                            status: {
                                error: '#e74c3c',
                                alert: '#e67e22',
                                success: '#2ecc71',
                                warning: '#f1c40f',
                            },
                            bg: {
                                body: '#1a1a2e', // Dark Navy Background (Sidebar area)
                                panel: '#f4f4f9', // Light Gray (Main Content)
                                card: '#FFFFFF',
                            },
                            text: {
                                primary: '#333333', // Dark Gray Text
                                secondary: '#64748B',
                                tertiary: '#94A3B8',
                                inverse: '#FFFFFF',
                            }
                        },
                        borderRadius: {
                            'xl': '12px',
                            '2xl': '16px',
                            '3xl': '24px',
                        },
                        boxShadow: {
                            card: '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.02)',
                            float: '0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08)',
                            glow: '0 0 15px rgba(179, 255, 80, 0.4)', // Lime glow
                        }
                    }
                }
            }
    </script>

    <!-- Unified Design System -->
    <link rel="stylesheet" href="assets/css/app.css">
</head>

<body>

    <div id="app" class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand flex items-center justify-center py-6 px-4">
                <img src="assets/images/logo-competenz-white.png" alt="Competenz Logo"
                    class="w-full h-auto object-contain transition-all duration-300">
            </div>

            <button class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('menu-open')">
                <i class="ph ph-list"></i>
            </button>

            <nav class="sidebar-nav">
                <ul class="nav-menu">
                    <li><a class="nav-item active" onclick="app.navigate('dashboard')">
                            <i class="ph ph-squares-four"></i> Dashboard
                        </a></li>
                    <li><a class="nav-item" onclick="app.navigate('secretaria')">
                            <i class="ph ph-users"></i> Secretaria
                        </a></li>
                    <li><a class="nav-item" onclick="app.navigate('pedagogico')">
                            <i class="ph ph-chalkboard-teacher"></i> Pedagógico
                        </a></li>
                    <li>
                        <a class="nav-item" onclick="app.navigate('planejamento')">
                            <i class="ph ph-briefcase"></i> Planejamento
                        </a>
                    </li>


                    <!-- Separator for mobile/desktop logic -->
                    <li class="nav-separator"></li>

                    <li>
                        <a class="nav-item" onclick="app.navigate('configuracoes')">
                            <i class="ph ph-gear"></i> Configurações
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-footer hidden md:block"
                style="padding: 1rem; font-size: 0.7rem; color: rgba(255,255,255,0.5); text-align: center; margin-top: auto;">
                © 2026 Competenz<br>Feito com ❤️ por Alisson Almeida Q.
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-panel">
            <!-- User Header -->
            <header
                class="sticky top-0 z-50 bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center shadow-sm">
                <div class="flex items-center gap-4">
                    <div id="userInfo" class="flex items-center gap-3">
                        <div id="userAvatar"
                            class="w-10 h-10 rounded-full bg-gradient-to-br from-[#667eea] to-[#764ba2] flex items-center justify-center text-white font-semibold text-lg shadow-md border-2 border-white">
                            <!-- Iniciais inseridas via JS -->
                        </div>
                        <div>
                            <div id="userName" class="font-semibold text-gray-800 text-sm"></div>
                            <div id="userRole"
                                class="text-xs text-gray-500 font-medium bg-gray-100 px-2 py-0.5 rounded-full inline-block mt-0.5">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="app.showUserMenu()"
                        class="flex items-center gap-2 px-4 py-2 bg-gray-50 hover:bg-white text-gray-600 border border-gray-200 hover:border-[#667eea] hover:text-[#667eea] rounded-lg transition-all shadow-sm">
                        <i class="ph ph-gear text-lg"></i>
                        <span class="text-sm font-medium">Configurações</span>
                    </button>

                    <button onclick="app.logout()"
                        class="flex items-center gap-2 px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 border border-red-100 hover:border-red-200 rounded-lg transition-all shadow-sm">
                        <i class="ph ph-sign-out text-lg"></i>
                        <span class="text-sm font-medium">Sair</span>
                    </button>
                </div>
            </header>

            <div id="content-area" class="content-scroll">
                <div style="height: 80vh; display: flex; align-items: center; justify-content: center;">
                    <div class="loading-spinner"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- UI Overlay Components -->
    <div id="toast" class="toast hidden"></div>

    <div id="modal-backdrop" class="modal-backdrop hidden">
        <div id="modal-panel" class="modal-panel">
            <div class="modal-header">
                <h3 id="modal-title">Título</h3>
                <button onclick="ui.closeModal()" class="modal-close"><i class="ph ph-x"></i></button>
            </div>
            <div id="modal-content" class="modal-body"></div>
        </div>
    </div>

    <!-- Core App Logic -->
    <script type="module" src="assets/js/app.js"></script>
</body>

</html>
